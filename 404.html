<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0c">
  <meta name="robots" content="noindex,follow">
  <title>الصفحة غير موجودة | GeoShield</title>
  <meta name="description" content="الصفحة المطلوبة غير موجودة. عُد إلى موقع جيوشيلد للأحساء والخفجي.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080a0c;--panel:#101316;--text:#f4f3ef;--muted:#92979d;--line:rgba(255,255,255,.1);--brand:#e8622b;--brand2:#ff7a3f}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-height:100svh;background:radial-gradient(circle at 80% 0%,rgba(232,98,43,.13),transparent 34%),linear-gradient(180deg,#090b0d 0%,#080a0c 100%);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    main{width:min(100%,980px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));overflow:hidden;box-shadow:0 32px 90px rgba(0,0,0,.28)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;align-items:center;text-decoration:none}.brand img{display:block;width:148px;height:auto;max-width:34vw}
    .code{direction:ltr;color:#686f75;font:600 11px/1.2 system-ui;letter-spacing:.16em}
    .content{padding:clamp(38px,7vw,82px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:44px}
    .kicker{display:block;margin-bottom:15px;color:var(--brand2);font-size:11px;font-weight:700;letter-spacing:.08em}
    h1{margin:0;font-size:clamp(38px,7vw,76px);line-height:1.08;letter-spacing:-.035em;text-wrap:balance}
    p{max-width:590px;margin:22px 0 0;color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.9;text-wrap:pretty}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
    .button{min-height:50px;padding:0 22px;border:1px solid var(--line);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);font-size:13px;font-weight:700;text-decoration:none;transition:transform .2s,border-color .2s,background .2s,color .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .button.primary{border-color:var(--brand);background:var(--brand);color:#fff}.button:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.3)}.button.primary:hover{background:#f06a31;border-color:#f06a31}
    .mark{direction:ltr;align-self:center;color:rgba(255,255,255,.045);font:700 clamp(120px,22vw,250px)/.8 system-ui;letter-spacing:-.08em;user-select:none}
    .links{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
    .links a{padding:20px 24px;color:#b8bcc0;text-decoration:none;font-size:12px;font-weight:600;text-align:center;border-inline-start:1px solid var(--line);transition:background .2s,color .2s}.links a:last-child{border-inline-start:0}.links a:hover{background:rgba(255,255,255,.035);color:#fff}
    a:focus-visible{outline:2px solid var(--brand2);outline-offset:4px}
    @media(max-width:720px){main{border-radius:20px}.top{padding:18px 20px}.brand img{width:125px}.content{grid-template-columns:1fr;padding:42px 24px 34px;gap:30px}.mark{display:none}.actions{display:grid;grid-template-columns:1fr}.button{width:100%}.links{grid-template-columns:1fr}.links a{border-inline-start:0;border-top:1px solid var(--line);padding:17px 20px}.links a:first-child{border-top:0}}
    @media(prefers-reduced-motion:reduce){.button,.links a{transition:none}}
  </style>
</head>
<body>
  <main aria-labelledby="error-title">
    <div class="top">
      <a class="brand" href="/geoshield/" aria-label="العودة إلى الصفحة الرئيسية لجيوشيلد">
        <img src="/geoshield/images/logo.webp" width="1200" height="473" alt="شعار جيوشيلد">
      </a>
      <span class="code">ERROR 404</span>
    </div>

    <section class="content">
      <div>
        <span class="kicker">الصفحة غير موجودة</span>
        <h1 id="error-title">يبدو أن هذا الرابط لم يعد هنا.</h1>
        <p>يمكنك العودة إلى الصفحة الرئيسية أو الانتقال مباشرة إلى الخدمات والحجز والفروع.</p>
        <div class="actions">
          <a class="button primary" href="/geoshield/">العودة للرئيسية</a>
          <a class="button" href="/geoshield/#booking">احجز موعدك</a>
        </div>
      </div>
      <div class="mark" aria-hidden="true">404</div>
    </section>

    <nav class="links" aria-label="روابط سريعة">
      <a href="/geoshield/#services">الخدمات</a>
      <a href="/geoshield/#branches">الفروع</a>
      <a href="/geoshield/#warranty">الضمان</a>
    </nav>
  </main>
</body>
</html>
