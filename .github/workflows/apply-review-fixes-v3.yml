name: Apply review fixes v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-review-fixes-v3.yml
      - .github/scripts/apply_review_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Apply approved fixes
        run: python .github/scripts/apply_review_fixes.py
      - name: Validate JavaScript
        run: node --check script.js
      - name: Commit approved fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refinements.css README.md .github/workflows/site-quality.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine package cards and service UI"
          git push
