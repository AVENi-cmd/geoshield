name: Apply review fixes v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply approved review fixes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          old_mini = dedent('''\
                  <div class="mini-services">
                    <div>تلميع احترافي</div>
                    <div>حماية الزجاج</div>
                    <div>رش وحماية أسفل السيارة</div>
                    <div>التلبيس الداخلي</div>
                  </div>''')
          new_mini = dedent('''\
                  <div class="mini-services" aria-label="خدمات إضافية">
                    <div class="mini-service-card">
                      <span class="gs-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 15.5a4.5 4.5 0 1 0 9 0 4.5 4.5 0 0 0-9 0Z"/><path d="M11 4v4M4 9l2.8 1.6M18 9l-2.8 1.6M17.5 4.5l-2.2 2.2M4.5 4.5l2.2 2.2"/></svg></span>
                      <span class="mini-service-label">تلميع احترافي</span>
                    </div>
                    <div class="mini-service-card">
                      <span class="gs-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14l1 14H4L5 5Z"/><path d="M8 9h8M7.5 13h9M7 17h10"/></svg></span>
                      <span class="mini-service-label">حماية الزجاج</span>
                    </div>
                    <div class="mini-service-card">
                      <span class="gs-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15h14l-1.5-5h-11L5 15Z"/><path d="M7 15v2M17 15v2M9 10l1-3h4l1 3"/><path d="M8 20h8"/></svg></span>
                      <span class="mini-service-label">رش وحماية أسفل السيارة</span>
                    </div>
                    <div class="mini-service-card">
                      <span class="gs-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4v7c0 2 1 3 3 3h5"/><path d="M8 8h5c2 0 3 1 3 3v8"/><path d="M8 19v-5M16 19v-5"/></svg></span>
                      <span class="mini-service-label">التلبيس الداخلي</span>
                    </div>
                  </div>''')
          html = replace_once(html, old_mini, new_mini, "mini services")

          old_tabs = dedent('''\
                  <div class="package-tabs" role="tablist" aria-label="فئات باقات الحماية">
                    <button class="active" type="button" role="tab" aria-selected="true" data-package="standard">حماية قياسية</button>
                    <button type="button" role="tab" aria-selected="false" data-package="half">حماية نصفية</button>
                    <button type="button" role="tab" aria-selected="false" data-package="full">حماية كاملة</button>
                  </div>''')
          new_tabs = dedent('''\
                  <div class="package-tabs" role="tablist" aria-label="فئات باقات الحماية والخدمات">
                    <button class="active" type="button" role="tab" aria-selected="true" data-package="standard">حماية قياسية</button>
                    <button type="button" role="tab" aria-selected="false" data-package="half">حماية نصفية</button>
                    <button type="button" role="tab" aria-selected="false" data-package="full">حماية كاملة</button>
                    <button type="button" role="tab" aria-selected="false" data-package="services">خدمات منفردة</button>
                  </div>''')
          html = replace_once(html, old_tabs, new_tabs, "package tabs")

          old_polish = dedent('''\
                  <div class="polish">
                    <div><span>خدمة منفردة</span><h3>تلميع كامل داخلي وخارجي</h3><p>يشمل واكس نانو مجانًا.</p></div>
                    <div class="polish-price"><b>450</b><small>صغير</small><b>550</b><small>كبير</small></div>
                  </div>''')
          new_polish = dedent('''\
                  <div class="package-panel package-services" data-panel="services">
                    <div class="polish">
                      <div class="polish-copy"><span>خدمة منفردة</span><h3>تلميع كامل داخلي وخارجي</h3><p>يشمل واكس نانو مجانًا.</p></div>
                      <div class="polish-price">
                        <span><small>للسيارة الصغيرة</small><b>450</b></span>
                        <span><small>للسيارة الكبيرة</small><b>550</b></span>
                      </div>
                    </div>
                  </div>''')
          html = replace_once(html, old_polish, new_polish, "standalone polish")

          old_friday = '<span>الجمعة</span><strong>٤:٠٠ - ١٠:٠٠ م</strong>'
          if html.count(old_friday) != 2:
              raise SystemExit("Expected two Friday rows")
          html = html.replace(old_friday, '<span>الجمعة</span><strong>٤:٠٠ م - ١٠:٠٠ م</strong>')
          index_path.write_text(html, encoding="utf-8")

          css_path = Path("refinements.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* 2026 package and service review fixes */"
          if marker not in css:
              css_patch = dedent('''\
                  /* 2026 package and service review fixes */
                  .service-card .service-book>span{letter-spacing:0!important}.service-card .service-book>span:not(.ui-icon){font-size:12px!important;font-weight:700!important;color:inherit!important;word-spacing:0!important}.package-book,.package-book span,.package-tabs button,.polish,.mini-services,.mini-service-label{letter-spacing:0!important;word-spacing:normal}
                  .mini-services{gap:14px}.mini-services>.mini-service-card{position:relative;isolation:isolate;overflow:hidden;min-height:126px;padding:22px 24px;display:flex;align-items:center;gap:18px;border:1px solid rgba(20,24,28,.13);border-radius:20px;background:linear-gradient(145deg,#fff 0%,#f4f2ec 100%);box-shadow:0 12px 34px rgba(20,24,28,.06);font-size:14px;font-weight:650;color:#1d2226;transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s}.mini-services>.mini-service-card:before{content:"";position:absolute;inset-block:18px;right:0;width:3px;border-radius:99px;background:linear-gradient(#ff7a3f,#b84a20)}.mini-services>.mini-service-card:after{content:"";position:absolute;z-index:-1;left:-44px;bottom:-54px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,43,.09),transparent 68%)}.mini-services>.mini-service-card:hover{transform:translateY(-3px);border-color:rgba(232,98,43,.28);background:linear-gradient(145deg,#fff 0%,#f5f1eb 100%);box-shadow:0 18px 42px rgba(20,24,28,.1)}.mini-services .gs-icon{width:54px;height:54px;flex:0 0 54px;border:1px solid rgba(232,98,43,.24);border-radius:16px;background:rgba(232,98,43,.065);color:#c44f22;box-shadow:none}.mini-services .gs-icon svg{width:26px;height:26px;stroke-width:1.7}.mini-service-label{line-height:1.65;text-wrap:balance}
                  .packages{--pkg-ink:#171a1d;--pkg-line:rgba(22,26,29,.13);--pkg-orange:#e8622b}.package-tabs{width:100%;max-width:840px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;margin-bottom:30px;border:1px solid rgba(22,26,29,.12);border-radius:18px;background:#e9e7e1;box-shadow:0 14px 34px rgba(22,26,29,.06)}.package-tabs button{min-width:0;min-height:48px;padding:10px 12px;border:1px solid transparent;border-radius:13px;color:#60666b;font-size:12px;font-weight:700;line-height:1.45;transition:background .22s,color .22s,border-color .22s,box-shadow .22s}.package-tabs button:hover{color:#252a2e;background:rgba(255,255,255,.54)}.package-tabs button[aria-selected="true"],.package-tabs button.active{background:#181c20;color:#fff;border-color:#181c20;box-shadow:0 8px 20px rgba(17,20,23,.16)}
                  .package-panel,.package-panel.active{width:100%;min-width:0}.package-panel.active{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.package-panel[data-panel=full].active{grid-template-columns:repeat(2,minmax(0,1fr))}.package-panel article{position:relative;isolation:isolate;overflow:hidden;width:100%;min-width:0;max-width:100%;min-height:450px;padding:34px;border:1px solid var(--pkg-line);border-radius:24px;background:linear-gradient(150deg,#fff 0%,#f8f7f3 58%,#f2f0ea 100%);color:var(--pkg-ink);box-shadow:0 16px 44px rgba(20,24,28,.075);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}.package-panel article:before{content:"";position:absolute;z-index:-1;top:0;right:0;width:132px;height:3px;background:linear-gradient(90deg,var(--pkg-orange),rgba(232,98,43,0))}.package-panel article:after{content:"";position:absolute;z-index:-2;left:-85px;bottom:-95px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,43,.08),transparent 69%)}.package-panel article:hover{transform:translateY(-4px);border-color:rgba(232,98,43,.3);box-shadow:0 22px 58px rgba(20,24,28,.12)}.package-panel article.featured{background:linear-gradient(150deg,#fffaf5 0%,#f8f4ee 55%,#efe9e1 100%);color:var(--pkg-ink);border-color:rgba(232,98,43,.32);box-shadow:0 18px 50px rgba(130,66,36,.1)}.package-panel article.featured:hover{border-color:rgba(232,98,43,.5);box-shadow:0 24px 62px rgba(130,66,36,.14)}.package-panel article>i{top:20px;left:20px;padding:6px 10px;border-radius:9px;background:#181c20;color:#fff;font-size:9px;letter-spacing:0}.package-panel small{color:#a94820;font-weight:700}.package-panel h3{margin:15px 0 22px;color:#171a1d;font-size:24px;line-height:1.45}.package-panel ul,.package-panel article.featured ul{color:#5d6368;line-height:1.9}.package-panel li::marker{color:#d35a29}.prices{gap:10px;padding-top:22px}.prices span{padding:12px 13px;border:1px solid rgba(22,26,29,.09);border-radius:13px;background:rgba(255,255,255,.5);color:#71777c}.prices b,.package-panel article.featured .prices b{margin-top:3px;color:#171a1d;font-size:30px}.featured .prices{border-color:rgba(22,26,29,.11)}.package-book,.featured .package-book{min-height:48px;margin-top:20px;padding:14px 2px 0;border-top-color:rgba(22,26,29,.11);color:#252a2e}.package-book:hover,.package-book:focus-visible,.featured .package-book:hover,.featured .package-book:focus-visible{color:#b6481f;border-top-color:rgba(232,98,43,.34)}.package-book .ui-icon,.featured .package-book .ui-icon{color:#e8622b}
                  .package-panel.package-services.active{display:block!important}.package-services[hidden]{display:none!important}.package-services .polish{margin:0;position:relative;isolation:isolate;overflow:hidden;padding:38px;border:1px solid rgba(255,122,63,.24);border-radius:24px;background:linear-gradient(145deg,rgba(255,122,63,.08),rgba(255,255,255,.025) 45%),#191d21;color:#f7f6f2;box-shadow:0 20px 58px rgba(20,24,28,.16);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);align-items:center;gap:34px}.package-services .polish:before{content:"";position:absolute;right:0;top:28px;bottom:28px;width:3px;border-radius:99px;background:linear-gradient(#ff7a3f,#b84920)}.package-services .polish-copy>span{color:#ff8c58;font-size:11px;font-weight:700}.package-services .polish h3{margin:8px 0 10px;color:#fff;font-size:clamp(25px,3vw,36px);line-height:1.35}.package-services .polish p{margin:0;color:#c3c8cc;font-size:14px}.package-services .polish-price{display:grid;grid-template-columns:1fr 1fr;gap:12px}.package-services .polish-price>span{padding:17px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(255,255,255,.045)}.package-services .polish-price small{display:block;margin-bottom:5px;color:#bbc1c6;font-size:10px;line-height:1.6}.package-services .polish-price b{display:block;color:#fff;font-size:34px;line-height:1.2}.package-services .polish-price b:after{color:#9fa6ac}.package-services .polish .package-book{grid-column:1/-1;width:100%;min-width:0;margin:0;padding:14px 18px;border:1px solid rgba(255,122,63,.3);border-radius:13px;background:rgba(232,98,43,.1);color:#fff;justify-content:center}.package-services .polish .package-book:hover,.package-services .polish .package-book:focus-visible{background:rgba(232,98,43,.17);border-color:rgba(255,122,63,.5);color:#fff}
                  @media(max-width:900px){.package-panel.active{grid-template-columns:repeat(2,minmax(0,1fr))}.package-panel article:last-child:nth-child(odd){grid-column:auto}.package-services .polish{grid-template-columns:1fr}}
                  @media(max-width:760px){.package-tabs{position:sticky;top:70px;z-index:40;width:calc(100% + 12px);max-width:none;margin-inline:-6px;margin-bottom:24px;padding:6px;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#f0eee8;border-color:rgba(22,26,29,.14);box-shadow:0 12px 28px rgba(20,24,28,.12);backdrop-filter:none;-webkit-backdrop-filter:none}.package-tabs button{min-height:46px;padding:7px 3px;font-size:10.5px;white-space:normal;text-wrap:balance}.package-panel.active,.package-panel[data-panel=full].active{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:12px;width:100%!important;min-width:0!important}.package-panel.package-services.active{display:block!important}.package-panel article,.package-panel article.featured{grid-column:auto!important;width:100%!important;min-width:0!important;max-width:100%!important;min-height:auto!important;padding:25px 22px;border-radius:19px}.package-panel article:hover,.package-panel article.featured:hover{transform:none}.package-panel h3{font-size:22px}.prices b,.package-panel article.featured .prices b{font-size:28px}.package-services .polish{padding:26px 22px;border-radius:19px;gap:22px}.package-services .polish-price{grid-template-columns:1fr}.package-services .polish-price>span{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}.package-services .polish-price small{margin:0}.package-services .polish-price b{font-size:31px}.mini-services>.mini-service-card{min-height:104px;padding:17px 16px;gap:13px;border-radius:16px}.mini-services .gs-icon{width:46px;height:46px;flex-basis:46px;border-radius:13px}.mini-services .gs-icon svg{width:23px;height:23px}.mini-service-label{font-size:12px}.service-card .service-book>span:not(.ui-icon){font-size:12px!important}}
                  @media(max-width:430px){.mini-services{grid-template-columns:1fr}.package-tabs button{font-size:9.8px}.package-services .polish-price>span{grid-template-columns:1fr}}
                  @media(hover:none){.mini-services>.mini-service-card:hover,.package-panel article:hover,.package-panel article.featured:hover{transform:none}}
                  @media(prefers-reduced-motion:reduce){.mini-services>.mini-service-card,.package-panel article,.package-tabs button{transition:none}}
              ''')
              css_path.write_text(css + "\n\n" + css_patch, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8").replace("٤:٠٠ - ١٠:٠٠ م", "٤:٠٠ م - ١٠:٠٠ م")
          readme_path.write_text(readme, encoding="utf-8")

          quality_path = Path(".github/workflows/site-quality.yml")
          quality = quality_path.read_text(encoding="utf-8")
          quality = quality.replace("html.count('<span>الجمعة</span><strong>٤:٠٠ - ١٠:٠٠ م</strong>') == 2", "html.count('<span>الجمعة</span><strong>٤:٠٠ م - ١٠:٠٠ م</strong>') == 2")
          quality = quality.replace("'Friday README hours': '| الجمعة | ٤:٠٠ - ١٠:٠٠ م | — |' in readme,", "'Friday README hours': '| الجمعة | ٤:٠٠ م - ١٠:٠٠ م | — |' in readme,")
          quality = quality.replace("polish_pattern = r'<div class=\"polish-price\"><b>450</b><small>صغير</small><b>550</b><small>كبير</small></div>'", "polish_pattern = r'<div class=\"polish-price\">.*?<small>للسيارة الصغيرة</small><b>450</b>.*?<small>للسيارة الكبيرة</small><b>550</b>.*?</div>'")
          anchor = "              'Aftercare heading present': 'توصيات ما بعد التركيب' in html,\n"
          extra = "              'Standalone services package tab': 'data-package=\"services\">خدمات منفردة</button>' in html and 'data-panel=\"services\"' in html,\n"
          if extra not in quality:
              if anchor not in quality:
                  raise SystemExit("Quality-check insertion anchor missing")
              quality = quality.replace(anchor, anchor + extra, 1)
          quality_path.write_text(quality, encoding="utf-8")

      - name: Validate result
        run: |
          node --check script.js
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('refinements.css').read_text(encoding='utf-8')
          assert html.count('٤:٠٠ م - ١٠:٠٠ م') == 2
          assert 'data-package="services">خدمات منفردة</button>' in html
          assert 'data-panel="services"' in html
          assert 'للسيارة الصغيرة' in html and 'للسيارة الكبيرة' in html
          assert '2026 package and service review fixes' in css
          print('Approved review fixes validated.')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refinements.css README.md .github/workflows/site-quality.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine package cards and service UI"
          git push
